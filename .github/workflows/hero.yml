name: hero

on:
  schedule:
    - cron: "5 21 * * *" # 00:05 in Addis Ababa (UTC+3), just after the Ethiopian day turns over
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hero.py
      - name: Commit if the date changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero.svg
          git diff --cached --quiet || git commit -m "hero: new day" && git push
